openapi: 3.0.0
info:
  title: Visual Bord Editor
  description: API for collaboration on whiteboards
  version: 1.0.0

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /boards:
    get:
      $ref: "./routes/boards.yaml#/getAllBoards"
    post:
      $ref: "./routes/boards.yaml#/createBoard"

  /boards/{boardId}:
    get:
      $ref: "./routes/boards.yaml#/getBoardById"
    delete:
      $ref: "./routes/boards.yaml#/deleteBoard"

  /boards/{boardId}/favorite:
    put:
      $ref: "./routes/boards.yaml#/updateBoardFavorite"

  /boards/{boardId}/rename:
    put:
      $ref: "./routes/boards.yaml#/renameBoard"

  /auth/login:
    post:
      $ref: "./routes/auth.yaml#/login"

  /auth/register:
    post:
      $ref: "./routes/auth.yaml#/register"

  /auth/refresh:
    post:
      $ref: "./routes/auth.yaml#/refresh"
